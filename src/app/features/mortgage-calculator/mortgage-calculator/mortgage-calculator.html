<section class="py-20 bg-gray-50">
  <div class="max-w-4xl mx-auto px-6">
    <h2 class="text-3xl font-bold text-center mb-10">Calculadora Hipotecaria</h2>

    <div class="bg-white shadow-xl rounded-xl p-8 grid md:grid-cols-2 gap-8">
      <div class="space-y-6">
        <div>
          <label class="text-sm text-gray-600">Precio de la propiedad</label>
          <input
            type="number"
            [(ngModel)]="price"
            class="w-full border rounded-lg px-4 py-2 mt-1"
          />
        </div>

        <div>
          <label class="text-sm text-gray-600">Enganche (%)</label>
          <input
            type="number"
            [(ngModel)]="downPayment"
            class="w-full border rounded-lg px-4 py-2 mt-1"
          />
        </div>

        <div>
          <label class="text-sm text-gray-600">Tasa de interés (%)</label>
          <input
            type="number"
            [(ngModel)]="interest"
            class="w-full border rounded-lg px-4 py-2 mt-1"
          />
        </div>

        <div>
          <label class="text-sm text-gray-600">Años</label>
          <input
            type="number"
            [(ngModel)]="years"
            class="w-full border rounded-lg px-4 py-2 mt-1"
          />
        </div>

        <button
          (click)="calculate()"
          class="bg-blue-600 text-white px-6 py-3 rounded-lg w-full hover:bg-blue-700"
        >
          Calcular
        </button>
      </div>

      <div class="flex items-center justify-center">
        <div class="text-center">
          <p class="text-gray-500">Pago mensual estimado</p>

          <p class="text-4xl font-bold text-blue-600 mt-4">
            ${{ monthlyPayment | number: '1.0-0' }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
