<section class="py-16">
  <div class="max-w-7xl mx-auto px-6">
    <h1 class="text-3xl font-bold mb-10">Propiedades disponibles</h1>

    <!-- FILTROS -->

    <div class="bg-gray-100 p-6 rounded-xl mb-10 grid md:grid-cols-3 gap-6">
      <select [(ngModel)]="filterType" class="border rounded-lg px-4 py-2">
        <option value="">Tipo</option>
        <option value="Venta">Venta</option>
        <option value="Renta">Renta</option>
      </select>

      <select [(ngModel)]="filterBeds" class="border rounded-lg px-4 py-2">
        <option [ngValue]="0">Habitaciones</option>
        <option [ngValue]="1">1+</option>
        <option [ngValue]="2">2+</option>
        <option [ngValue]="3">3+</option>
      </select>

      <button
        (click)="applyFilters()"
        class="bg-blue-600 text-white rounded-lg px-6 py-2 hover:bg-blue-700"
      >
        Aplicar filtros
      </button>
    </div>

    <!-- GRID PRINCIPAL -->

    <div class="grid lg:grid-cols-2 gap-10">
      <!-- PROPIEDADES -->

      <div class="grid md:grid-cols-2 gap-8">
        <app-property-card *ngFor="let property of filteredProperties" [property]="property">
        </app-property-card>
      </div>

      <!-- MAPA -->

      <div class="h-[600px] rounded-xl overflow-hidden shadow sticky top-24">
        <iframe class="w-full h-full" [src]="mapUrl"> </iframe>
      </div>
    </div>
  </div>
</section>
