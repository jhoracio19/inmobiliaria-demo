<a
  [routerLink]="['/propiedad', property.slug]"
  class="group block bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-2xl transition duration-300"
>
  <!-- Imagen -->
  <div class="relative overflow-hidden">
    <img
      [src]="property.imageUrl"
      class="h-64 w-full object-cover group-hover:scale-105 transition duration-500"
    />

    <!-- Badge venta / renta -->
    <div
      class="absolute top-4 right-4 bg-white text-sm font-semibold px-3 py-1 rounded-full shadow"
    >
      {{ property.type }}
    </div>
  </div>

  <!-- Info -->
  <div class="p-5">
    <!-- ubicación -->
    <p class="text-sm text-gray-500">
      {{ property.location }}
    </p>

    <!-- titulo -->
    <h3 class="text-lg font-semibold mt-1">
      {{ property.title }}
    </h3>

    <!-- specs -->
    <div class="flex gap-4 text-sm text-gray-500 mt-3">
      <span> 🛏 {{ property.beds }} Hab. </span>

      <span> 🛁 {{ property.baths }} Baños </span>

      <span> 📐 {{ property.sqft }} m² </span>
    </div>

    <!-- precio -->
    <div class="mt-4 text-xl font-bold text-blue-600">${{ property.price | number }}</div>
  </div>
</a>
