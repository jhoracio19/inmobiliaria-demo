<section class="bg-white py-8 -mt-12 relative z-20">
  <div class="max-w-6xl mx-auto px-6">
    <div class="grid md:grid-cols-4 gap-4 bg-white p-4 rounded-xl shadow-lg">
      <!-- ubicación -->

      <input
        [(ngModel)]="location"
        type="text"
        placeholder="Ubicación"
        class="border rounded-lg px-4 py-3"
      />

      <!-- tipo -->

      <select [(ngModel)]="type" class="border rounded-lg px-4 py-3">
        <option value="Venta">Venta</option>
        <option value="Renta">Renta</option>
      </select>

      <!-- habitaciones -->

      <select [(ngModel)]="beds" class="border rounded-lg px-4 py-3">
        <option [ngValue]="1">1+</option>
        <option [ngValue]="2">2+</option>
        <option [ngValue]="3">3+</option>
      </select>

      <!-- botón -->

      <button
        (click)="search()"
        class="bg-blue-600 text-white rounded-lg px-6 py-3 hover:bg-blue-700"
      >
        Buscar
      </button>
    </div>
  </div>
</section>
